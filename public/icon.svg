<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4500" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF9F1C" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#0A0A0E" />
  
  <!-- Outer Glow Orbit -->
  <ellipse cx="256" cy="256" rx="210" ry="110" fill="none" stroke="url(#rkGrad)" stroke-width="6" opacity="0.4" transform="rotate(-25 256 256)" filter="url(#glow)" />
  <ellipse cx="256" cy="256" rx="210" ry="110" fill="none" stroke="#FF5722" stroke-width="4" opacity="0.8" transform="rotate(-25 256 256)" />
  
  <!-- Circular Glow Core -->
  <circle cx="256" cy="256" r="140" fill="#12121A" stroke="url(#rkGrad)" stroke-width="8" filter="url(#glow)" />
  
  <!-- Monogram RK Tech Typography -->
  <text x="256" y="295" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="140" font-weight="900" fill="url(#rkGrad)" text-anchor="middle" letter-spacing="4">RK</text>
  
  <!-- Code bracket accents </ > -->
  <text x="145" y="270" font-family="monospace" font-size="45" font-weight="bold" fill="#00E5FF" opacity="0.85">&lt;</text>
  <text x="365" y="270" font-family="monospace" font-size="45" font-weight="bold" fill="#00E5FF" opacity="0.85">&gt;</text>
</svg>
